name: Deploy

on:
    push:
        branches:
            - master

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  port: ${{ secrets.PORT }}
                  script: |
                      # Прерываем деплой на первой ошибке, чтобы не перезапускать pm2 без сборки
                      set -e
                      APP_DIR=/var/www/altertravel.ru/data/www/altertravel.ru

                      # Если репозитория ещё нет — клонируем, но только в пустую папку
                      mkdir -p "$APP_DIR"
                      cd "$APP_DIR"
                      git config --global --get-all safe.directory | grep -qxF "$APP_DIR" || git config --global --add safe.directory "$APP_DIR"
                      if [ ! -d .git ]; then
                          if [ -n "$(ls -A | grep -vxF .env)" ]; then
                              echo "$APP_DIR не пустая и не git-репозиторий, освободите её"; exit 1
                          fi
                          git init
                          git remote add origin https://github.com/andreev-e/alter-nuxt.git
                      fi
                      git fetch origin master
                      git checkout -f -B master origin/master

                      # Удаляем кеш Nuxt, чтобы избежать проблем с правами доступа
                      rm -rf .nuxt

                      # Ключ MapTiler для карты с русскими подписями
                      touch .env
                      sed -i '/^MAPTILER_KEY=/d' .env
                      echo "MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}" >> .env

                      # API_URL и PORT задаются в .env на сервере вручную
                      for var in API_URL PORT; do
                          grep -q "^$var=" .env || { echo "В $APP_DIR/.env не задан $var"; exit 1; }
                      done

                      # Убеждаемся, что используем Node.js 16 (если на сервере стоит другая версия)
                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                      nvm use 16 || nvm install 16
                      node -v

                      # Установка зависимостей и сборка
                      npm install
                      npm run build

                      # Старый процесс .pro-версии больше не нужен
                      pm2 delete altertravel.pro 2>/dev/null || true

                      # Перезапускаем приложение, а если его ещё нет в pm2 — запускаем
                      pm2 restart altertravel.ru || pm2 start npm --name altertravel.ru -- run start
                      pm2 save
