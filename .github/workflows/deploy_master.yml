name: Deploy

on:
    push:
        branches:
            - master

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  port: ${{ secrets.PORT }}
                  command_timeout: 30m
                  script: |
                      set -e
                      SITE_USER=altertravel.ru

                      # Старый процесс .pro-версии в pm2 root-а больше не нужен
                      if [ "$(id -un)" = root ] && command -v pm2 >/dev/null; then
                          pm2 delete altertravel.pro 2>/dev/null || true
                          pm2 save --force >/dev/null 2>&1 || true
                      fi

                      # Всё остальное выполняем от пользователя сайта, а не от root
                      if [ "$(id -un)" = "$SITE_USER" ]; then
                          RUN="bash -se"
                      else
                          RUN="su - $SITE_USER -s /bin/bash -c 'bash -se'"
                      fi

                      eval "$RUN" <<'DEPLOY'
                      # Прерываем деплой на первой ошибке, чтобы не перезапускать pm2 без сборки
                      set -e
                      APP_DIR=/var/www/altertravel.ru/data/www/altertravel.ru
                      REPO_URL=https://github.com/andreev-e/alter-nuxt.git

                      cd "$APP_DIR"

                      # .env могли положить во временную папку altertravel-nuxt — берём оттуда
                      [ -f .env ] || cp /var/www/altertravel.ru/data/www/altertravel-nuxt/.env . 2>/dev/null || true

                      # Если репозитория ещё нет — клонируем, но только в пустую папку
                      if [ ! -d .git ]; then
                          if [ -n "$(ls -A | grep -vxF .env)" ]; then
                              echo "$APP_DIR не пустая и не git-репозиторий, освободите её"; exit 1
                          fi
                          git init
                      elif ! git remote -v | grep -qiE 'andreev-e/alter[-_]nuxt' \
                          && ! grep -qE '"name": *"alter-nuxt"' package.json 2>/dev/null; then
                          # Не перезаписываем чужой проект
                          echo "$APP_DIR — репозиторий другого проекта:"; git remote -v; exit 1
                      fi
                      git fetch "$REPO_URL" master
                      git checkout -f -B master FETCH_HEAD

                      # Удаляем кеш Nuxt, чтобы сборка шла с нуля
                      rm -rf .nuxt

                      # Ключ MapTiler для карты с русскими подписями
                      touch .env
                      sed -i '/^MAPTILER_KEY=/d' .env
                      echo "MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}" >> .env

                      grep -q '^API_URL=' .env || echo "API_URL=http://api.altertravel.ru" >> .env

                      # PORT задаётся в .env на сервере вручную: он должен совпадать с proxy_pass в nginx
                      for var in API_URL PORT; do
                          grep -q "^$var=" .env || { echo "В $APP_DIR/.env не задан $var"; exit 1; }
                      done

                      # Node.js 16 через nvm пользователя сайта
                      export NVM_DIR="$HOME/.nvm"
                      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | PROFILE=/dev/null bash
                      fi
                      . "$NVM_DIR/nvm.sh"
                      nvm use 16 || nvm install 16
                      node -v
                      command -v pm2 >/dev/null || npm install -g pm2

                      # Установка зависимостей и сборка
                      npm install
                      npm run build

                      # Перезапускаем приложение, а если его ещё нет в pm2 — запускаем
                      pm2 restart altertravel.ru || pm2 start npm --name altertravel.ru -- run start
                      pm2 save
                      DEPLOY
